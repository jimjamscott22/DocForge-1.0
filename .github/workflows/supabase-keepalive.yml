name: Supabase Keepalive

on:
  schedule:
    # Runs every 3 days at 00:00 UTC. Supabase free-tier projects pause after
    # 7 days of inactivity, so this leaves a comfortable margin.
    - cron: "0 0 */3 * *"
  workflow_dispatch:

# Never let a manual run and a scheduled run push at the same time.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Ping Supabase
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # A shallow (depth-1) checkout strips the parent link off the boundary
          # commit. Amending that commit then produces a parentless orphan commit,
          # which the force-push below would happily publish over real history.
          # Full history avoids that footgun.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run keepalive script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keepalive-supabase.mjs

      # GitHub disables scheduled workflows in public repos after 60 days with no
      # repo activity. Committing a timestamp on every run keeps the repo active
      # so this workflow is never switched off. Runs even if the ping above failed
      # (the job still reports that failure) — otherwise a broken ping would also
      # silently kill the schedule.
      #
      # To avoid a new commit piling up every 12h forever, this amends the
      # previous commit in place when it was itself a keepalive commit, instead
      # of stacking a fresh one. A keepalive commit only becomes permanent once
      # a real commit is pushed on top of it.
      - name: Commit keepalive timestamp
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git add .github/last-keepalive.txt
          if git log -1 --pretty=%s | grep -qF "chore: supabase keepalive timestamp"; then
            git commit --amend -m "chore: supabase keepalive timestamp [skip ci]"
            git push --force-with-lease origin "HEAD:${GITHUB_REF_NAME}"
          else
            git commit -m "chore: supabase keepalive timestamp [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
