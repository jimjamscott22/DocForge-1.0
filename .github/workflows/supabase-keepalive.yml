name: Supabase Keepalive

on:
  schedule:
    # Runs every 12 hours (at 00:00 and 12:00 UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch:

# Never let a manual run and a scheduled run push at the same time.
concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  keepalive:
    name: Ping Supabase
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run keepalive script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/keepalive-supabase.mjs

      # GitHub disables scheduled workflows in public repos after 60 days with no
      # repo activity. Committing a timestamp on every run keeps the repo active
      # so this workflow is never switched off. Runs even if the ping above failed
      # (the job still reports that failure) — otherwise a broken ping would also
      # silently kill the schedule.
      - name: Commit keepalive timestamp
        if: always()
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive.txt
          git commit -m "chore: supabase keepalive timestamp [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
